<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 17px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #60a5fa;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .preview {
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      background: #1f2937;
      display: none;
    }

    .scene {
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      background: #374151;
    }

    .loading {
      text-align: center;
      color: #60a5fa;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Auto Video Generator</h1>

    <div class="subtitle">
      စာထည့်လိုက်ရုံနဲ့ Video အတွက် Scene ပြင်ဆင်ပေးမယ်
    </div>

    <textarea
      id="story"
      placeholder="ဥပမာ - ကောင်လေးတစ်ယောက် မနက်ခင်းမှာ ရွာလမ်းပေါ် လမ်းလျှောက်နေတယ်..."
    ></textarea>

    <button onclick="generateVideo()">
      🚀 Generate Video
    </button>

    <div class="loading" id="loading">
      ⏳ Video ပြင်ဆင်နေပါတယ်...
    </div>

    <div class="preview" id="preview">
      <h2>🎞️ Video Plan</h2>
      <div id="scenes"></div>
    </div>

  </div>
